[package]
name = "strata-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "strata_core"
crate-type = ["cdylib", "lib"]

[dependencies]
uniffi = { workspace = true }
async-trait = "0.1"
thiserror = "2"

# Crypto: only the primitives in docs/spec.md §3. Default features are trimmed
# so nothing outside the spec gets compiled in (e.g. hpke's NIST-curve KEMs, or
# argon2's PHC password-hash strings). hpke needs both `x25519` and `mlkem` for X-Wing.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.13.0"
# `zeroize` wipes the SHA-256 states (and so HKDF/HMAC pads keyed by secrets) on drop.
sha2 = { version = "0.11.0", features = ["zeroize"] }
hmac = { version = "0.13.0", features = ["zeroize"] }
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "mlkem", "chacha"] }
ed25519-dalek = "3.0.0"
subtle = "2.6.1"
getrandom = "0.4.3"
zeroize = { version = "1.9.1", features = ["derive"] }

# Encoding
unicode-normalization = "0.1.25"
minicbor = { version = "2.3.0", features = ["alloc", "derive"] }
# English word list only; we use BIP39's encoding, never its seed derivation.
bip39 = { version = "3.0.0", default-features = false, features = ["alloc", "zeroize"] }
zxcvbn = { version = "3.1.1", default-features = false }
# Entry and device IDs cross the FFI as hex strings.
hex = "0.4.3"

# KDBX import and export (KeePass files; spec §8.2). Its own crypto is KDBX's, never Strata's.
keepass = { version = "0.15.2", features = ["save_kdbx4"] }
# The types keepass uses for entry times and UUIDs.
chrono = { version = "0.4.45", default-features = false }
uuid = { version = "1.28.0", default-features = false }

[dev-dependencies]
hex = "0.4.3"
proptest = "1.12.0"
serde_json = "1.0.154"
tempfile = "3.27.0"
unicode-normalization = "0.1.25"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Security_Credentials", "Security_Cryptography", "Storage_Streams", "Win32_Foundation", "Win32_System_TpmBaseServices", "Win32_UI_WindowsAndMessaging", "Win32_System_WinRT"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
tss-esapi = "7.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
security-framework-sys = "2.17.0"
