[workspace]
resolver = "3"
members = ["strata-core", "uniffi-bindgen"]
# Nightly-only libFuzzer targets; built separately with cargo-fuzz.
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
uniffi = "0.32"

[profile.release]
# Keep unwinding: UniFFI turns Rust panics into Kotlin exceptions instead of aborting the app.
lto = "thin"
codegen-units = 1
# Not "symbols": UniFFI reads its metadata from exported symbols in the built library.
strip = "debuginfo"

# Crypto is very slow unoptimized: Argon2 at the spec's 64 MiB takes seconds, and the
# tamper tests run thousands of Ed25519 verifications. Optimize these crates even in
# dev and test builds (test inherits dev).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.ml-kem]
opt-level = 3
