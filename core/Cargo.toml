[workspace]
resolver = "3"
members = ["strata-core", "uniffi-bindgen"]
# Nightly-only libFuzzer targets; built separately with cargo-fuzz.
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
uniffi = "0.32"

[profile.release]
# Keep unwinding: UniFFI turns Rust panics into Kotlin exceptions instead of aborting the app.
lto = "thin"
codegen-units = 1
# Not "symbols": UniFFI reads its metadata from exported symbols in the built library.
strip = "debuginfo"

# Argon2 at the spec's 64 MiB takes many seconds unoptimized. Optimize it even in
# dev and test builds (test inherits dev).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
