# Fuzz targets for the core's parsers (spec §14.2). Needs nightly and cargo-fuzz:
#   cd core && cargo +nightly fuzz run <target>
# Kept out of the main workspace because libFuzzer only builds on nightly.

[package]
name = "strata-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
strata-core = { path = "../strata-core" }

[[bin]]
name = "reader"
path = "fuzz_targets/reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "padding"
path = "fuzz_targets/padding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelopes"
path = "fuzz_targets/envelopes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bodies"
path = "fuzz_targets/bodies.rs"
test = false
doc = false
bench = false

[[bin]]
name = "names"
path = "fuzz_targets/names.rs"
test = false
doc = false
bench = false

[[bin]]
name = "local_state"
path = "fuzz_targets/local_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kdbx"
path = "fuzz_targets/kdbx.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
