# cargo-deny: licenses, security advisories, and dependency sources for the Rust core.
# Run from core/: `cargo deny check`. CI runs it on every push.

[graph]
all-features = false

[advisories]
version = 2
# Every RustSec advisory, including "unmaintained", fails the check. If one has to
# be accepted, list its ID here with a comment explaining why.
ignore = []

[licenses]
version = 2
# Strata is GPL-3.0-or-later; everything below is compatible with it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    # minicbor. Permissive (OSI-approved) with an explicit patent grant.
    "BlueOak-1.0.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
