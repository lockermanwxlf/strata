name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # Linux also gets a software TPM and a keyring daemon, so the Linux platform
      # protectors are tested against real services (core/tools/linux-protectors.sh),
      # and KeePassXC, which checks the KeePass export (core/tools/kdbx-check.sh).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev libdbus-1-dev pkg-config swtpm swtpm-tools gnome-keyring dbus-x11 keepassxc
      - working-directory: core
        run: cargo fmt --check
      - working-directory: core
        run: cargo clippy --all-targets -- -D warnings
      - if: runner.os != 'Linux'
        working-directory: core
        run: cargo test
      - if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/core/target
        run: bash core/tools/linux-protectors.sh
      - if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/core/target
        run: bash core/tools/kdbx-check.sh

  deny:
    name: Rust dependency licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml

  vectors:
    name: Test vectors (independent cross-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run core/tools/vectors/check.py

  fuzz:
    name: Fuzz smoke test (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # The Linux platform protectors link the TPM software stack and D-Bus.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fuzz
      - run: cargo install cargo-fuzz --locked
      - working-directory: core
        run: |
          for target in $(cargo fuzz list); do
            mkdir -p "fuzz/corpus/$target"
            cargo fuzz run "$target" "fuzz/corpus/$target" "fuzz/seeds/$target" -- -max_total_time=60
          done

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
      # The Linux platform protectors link the TPM software stack and D-Bus.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :shared:jvmTest :desktopApp:packageDistributionForCurrentOS
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: strata-desktop-${{ matrix.os }}
          path: desktopApp/build/compose/binaries/main/*/*
          if-no-files-found: error

  android:
    name: Android
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      # The bindings come from a host build of the core, which links the Linux
      # platform protectors' TPM software stack and D-Bus.
      - run: sudo apt-get update && sudo apt-get install -y libtss2-dev libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: strata-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
